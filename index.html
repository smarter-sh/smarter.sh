<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="canonical" href="https://smarter.sh/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>The Smarter Project | Learn AI. Build with AI. Govern AI.</title>

    <meta name="robots" content="index, follow" />
    <meta name="author" content="Lawrence McDaniel" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Smarter is a free, open-source platform where your people learn to build AI applications, and then build the real ones, on infrastructure you own and govern."
    />
    <meta
      property="og:image"
      content="https://cdn.platform.smarter.sh/cms/img/smarter_og_image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Smarter Project" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Smarter Project" />
    <meta property="og:site_name" content="The Smarter Project" />
    <meta property="og:url" content="https://smarter.sh/" />
    <meta
      property="og:description"
      content="Learn AI. Build with AI. Govern AI. One open-source platform that takes an organization from its first AI lesson to governed, production AI, on infrastructure it owns."
    />
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@smarter" />
    <meta name="twitter:title" content="The Smarter Project" />
    <meta
      name="twitter:description"
      content="Learn AI. Build with AI. Govern AI. One open-source platform that takes an organization from its first AI lesson to governed, production AI, on infrastructure it owns."
    />
    <meta
      name="twitter:image"
      content="https://cdn.platform.smarter.sh/cms/img/smarter_og_image.png"
    />

    <style>
      #splash-screen {
        position: fixed;
        top: 50%;
        left: 50%;
        background: #323c55;
        display: flex;
        height: 100%;
        width: 100%;
        transform: translate(-50%, -50%);
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: all 15s linear;
        overflow: hidden;
      }

      #splash-screen.remove {
        animation: fadeout 0.7s forwards;
        z-index: 0;
      }

      @keyframes fadeout {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="splash-screen">
      <img alt="Logo" class="light" src="/logo.png" style="height: 8%" />
    </div>
    <script type="module" src="/src/main"></script>
    <script>
      const rootEl = document.querySelector('#root')
      new MutationObserver(() => {
        document.querySelector('#splash-screen')?.classList.add('remove')
      }).observe(rootEl, { childList: true })
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "The Smarter Project",
        "url": "https://smarter.sh",
        "logo": "https://cdn.smarter.sh/images/logo/smarter-crop.png",
        "description": "A free, open-source platform for learning AI, building AI applications and governing every AI resource an organization owns.",
        "sameAs": [
          "https://docs.smarter.sh/",
          "https://blog.smarter.sh/",
          "https://github.com/smarter-sh/",
          "https://hub.docker.com/r/mcdaniel0073/smarter",
          "https://artifacthub.io/packages/helm/project-smarter/smarter",
          "https://pypi.org/project/smarter-api/",
          "https://github.com/smarter-sh/smarter-nodejs",
          "https://github.com/smarter-sh/smarter-golang",
          "https://github.com/smarter-sh/extensions-registry",
          "https://www.npmjs.com/package/@smarter.sh/ui-chat",
          "https://www.youtube.com/@project-smarter",
          "https://marketplace.visualstudio.com/items?itemName=querium.smarter-manifest"
        ]
      }
    </script>
  </body>
</html>
