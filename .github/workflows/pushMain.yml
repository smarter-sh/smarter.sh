---
#------------------------------------------------------------------------------
# Push to main
#
# Runs after a pull request is merged into main (pull requests to main are
# tested beforehand by test.yml):
#
# 1. test             run the unit tests again, on the merged code
# 2. semantic-release bump package.json, update CHANGELOG.md, tag, and
#                     create the GitHub release (.releaserc)
# 3. build            build dist/ from the release commit (build.yml)
# 4. release          deploy dist/ to the production S3 bucket and invalidate
#                     CloudFront (release.yml)
# 5. merge-main       merge main back into alpha and beta, so that they carry
#                     the release commit
#
# Each step runs only if the one before it succeeded. A merge whose commits
# don't call for a new version (e.g. only docs or chore commits) is still
# built and deployed.
#------------------------------------------------------------------------------
name: Push to main

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: push-main
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  semantic-release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com

      - name: Push updates to branch for major version
        if: steps.semantic.outputs.new_release_published == 'true'
        run: git push "https://x-access-token:${{ secrets.PAT }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/v${{ steps.semantic.outputs.new_release_major_version }}"

  build:
    needs: semantic-release
    uses: ./.github/workflows/build.yml
    with:
      # main's head, which is the release commit if semantic-release made one
      ref: main

  release:
    needs: build
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      branch: main

  merge-main:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Merge main into alpha
        uses: ./.github/actions/merge-branch
        with:
          github-token: ${{ secrets.PAT }}
          source-branch: main
          target-branch: alpha

      - name: Merge main into beta
        uses: ./.github/actions/merge-branch
        with:
          github-token: ${{ secrets.PAT }}
          source-branch: main
          target-branch: beta
