---
#------------------------------------------------------------------------------
# Build
#
# Build the production bundle of the React app (make build) and upload dist/
# as the "dist" artifact, for release.yml to deploy.
#
# - Called by pushMain.yml after semantic-release, from the branch's latest
#   commit, so that the bundle carries the version that was just released.
# - Can be run by hand from the Actions tab, on any branch.
#------------------------------------------------------------------------------
name: Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'The branch, tag or commit to build'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: make build

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
