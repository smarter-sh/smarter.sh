---
#------------------------------------------------------------------------------
# Test
#
# Run the Jest unit tests.
#
# - Runs on every pull request to main, so that a pull request is tested
#   before it is merged. Make this check required in main's branch
#   protection to block merging a pull request whose tests fail.
# - Called by pushMain.yml as the first step after a merge to main.
# - Can be run by hand from the Actions tab, on any branch.
#------------------------------------------------------------------------------
name: Test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test
